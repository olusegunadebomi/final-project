<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Student Web Advising</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/navigation.css">
</head>

<body class="auth-page auth-login">
  <div data-site-nav></div>
  <main class="auth-shell">
    <section class="auth-panel">
      <h1>Welcome back</h1>
      <p class="auth-intro">Log in to continue to student advising.</p>
      <form action="chatscreen.html" onsubmit="return validation()" class="auth-form">
        <div class="auth-field">
          <label for="user">Username</label>
          <input type="text" name="user" id="user" autocomplete="username" required>
          <span id="username" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="pass">Password</label>
          <input type="password" name="pass" id="pass" autocomplete="current-password" required>
          <span id="passwords" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-actions">
          <button class="auth-button" type="submit">Log in</button>
        </div>
        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </section>
  </main>

  <script src="../js/site-nav.js"></script>
  <script src="../js/JSlogin.js"></script>
</body>

</html>
