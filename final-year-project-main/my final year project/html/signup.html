<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Student Web Advising</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/navigation.css">
</head>

<body class="auth-page">
  <div data-site-nav></div>
  <main class="auth-shell">
    <section class="auth-panel">
      <h1>Create your account</h1>
      <p class="auth-intro">Enter your student and contact details to get started.</p>
      <form action="startchat.html" onsubmit="return validation()" class="auth-form">
        <div class="auth-field">
          <label for="name">Full name</label>
          <input type="text" name="name" id="name" autocomplete="name" required>
          <span id="Name" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="emails">Email</label>
          <input type="email" name="email" id="emails" autocomplete="email" required>
          <span id="emailids" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="user">Username</label>
          <input type="text" name="user" id="user" autocomplete="username" required>
          <span id="username" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="regnumber">Registration / matric number</label>
          <input type="text" name="regnumber" id="regnumber" autocomplete="off" required>
          <span id="regu" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="level">Current level</label>
          <select name="level" id="level" required>
            <option value="">Choose your level</option>
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="300">300</option>
            <option value="400">400</option>
          </select>
        </div>
        <div class="auth-field">
          <label for="mobileNumber">Mobile number</label>
          <input type="tel" name="mobile" id="mobileNumber" autocomplete="tel" required>
          <span id="mobileno" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="pass">Password</label>
          <input type="password" name="pass" id="pass" autocomplete="new-password" required>
          <span id="passwords" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-field">
          <label for="conpass">Confirm password</label>
          <input type="password" name="conpass" id="conpass" autocomplete="new-password" required>
          <span id="confrmpass" class="text-danger" aria-live="polite"></span>
        </div>
        <div class="auth-actions">
          <button class="auth-button" type="submit">Create account</button>
          <button class="auth-button auth-button--secondary" type="reset">Reset</button>
        </div>
        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </section>
  </main>

  <script src="../js/site-nav.js"></script>
  <script src="../js/JSindex.js"></script>
</body>

</html>
